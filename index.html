            display: none !important;

        .prose-tight p:last-child { margin-bottom: 0; }

<body>
    <div id="root"></div>

    <!-- GDPR Cookie Bar -->
    <div id="cookie-bar"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = 'https://api.cognitivecouncil.com/api/chat';

        // ─── Cookie Consent (non-blocking bottom strip) ───
        const CookieBar = () => {
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const consent = localStorage.getItem('cookieConsent');
                if (consent === null) setVisible(true);
                else if (consent === 'accepted') loadGA();
            }, []);

            const loadGA = () => {
                if (!document.getElementById('ga-script-counsel')) {
                    const script = document.createElement('script');
                    script.id = 'ga-script-counsel';
                    script.async = true;
                    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-9S5B92BF60';
                    document.head.appendChild(script);
                    window.dataLayer = window.dataLayer || [];
                    function gtag(){dataLayer.push(arguments);}
                    window.gtag = gtag;
                    gtag('js', new Date());
                    gtag('config', 'G-9S5B92BF60');
                }
            };

            if (!visible) return null;

            return (
                <div className="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-sm border-t border-slate-700/50 px-4 py-3">
                    <div className="max-w-4xl mx-auto flex items-center justify-between gap-4 flex-wrap">
                        <p className="text-slate-300 text-sm flex-1 min-w-[200px]">
                            We use Google Analytics to improve this experience.{' '}
                            <a href="https://policies.google.com/technologies/cookies" target="_blank" rel="noopener" className="text-amber-400/70 hover:text-amber-300 underline">Learn more</a>
                        </p>
                        <div className="flex gap-2">
                            <button onClick={() => { localStorage.setItem('cookieConsent','accepted'); setVisible(false); loadGA(); }}
                                className="px-4 py-1.5 bg-amber-500/60 hover:bg-amber-500/80 text-white text-sm rounded-lg transition-colors">Accept</button>
                            <button onClick={() => { localStorage.setItem('cookieConsent','declined'); setVisible(false); }}
                                className="px-4 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-sm rounded-lg transition-colors">Decline</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        //  THE ENGINE (never narrates a verdict about the user)
        // ═══════════════════════════════════════════════════════════════

        // ─── Vetted, static primer set ───
        // Shared, verbatim, with Cognitive Council. This array is BOTH the
        // lightbox content AND the whitelist of mechanisms the model may name.
        // Mechanism-level, hedged, framed around evolutionary mismatch.
        const primers = [
            {
                id: 'loss-aversion',
                name: 'Loss aversion',
                short: 'We feel a loss more sharply than an equivalent gain.',
                body: `Most people will work harder to avoid losing something than to gain something of the same size — a loss tends to register as noticeably more significant than an equivalent win. It's one of the more durable findings in behavioural science.

It likely made sense in an environment where a lost resource could be the difference between surviving the winter and not. In a modern life, the same wiring can keep you holding on to something mainly because letting go *feels* like a loss — even when it no longer serves you. Noticing that pull is sometimes enough to weigh things more evenly.`
            },
            {
                id: 'present-bias',
                name: 'Present bias',
                short: 'The near term feels far more vivid and urgent than the future.',
                body: `We tend to weight what's immediate much more heavily than what's distant, and a future reward seems to shrink the further off it is. Behavioural scientists call this present bias, or temporal discounting.

For most of human history the future was genuinely uncertain, so favouring the sure thing in front of you was reasonable. Today the same tilt can quietly undercut things whose payoff is real but delayed — the version of you acting now and the version who lives with it can feel like different people. Naming the gap doesn't close it, but it can bring the future self a little more into the room.`
            },
            {
                id: 'sunk-cost',
                name: 'The sunk-cost effect',
                short: 'Past investment pulls on choices it shouldn’t really touch.',
                body: `Once we've put time, money, or effort into something, we find it disproportionately hard to walk away — even when the smart move forward ignores what's already spent. This is the sunk-cost effect.

A reluctance to waste hard-won resources was a sensible instinct in leaner times. But what happens next depends only on what's ahead, not on what's already gone. When you notice yourself justifying a path mainly by how much you've already put in, it can help to ask what you'd choose if you were arriving at it fresh today.`
            },
            {
                id: 'status-quo',
                name: 'Status-quo bias',
                short: 'Staying the same feels safer than it often is.',
                body: `We carry a measurable pull toward leaving things as they are. A change that goes wrong tends to sting more than a missed improvement, so whatever we're already doing quietly carries an advantage in our minds.

When the world around us changed slowly, staying put was usually low-risk. In a faster-moving life, not changing is still a choice with consequences — it just doesn't feel like one, because nothing visibly *happened*. It can be worth asking whether you'd actively choose your current habit if it weren't already the default.`
            },
            {
                id: 'negativity-bias',
                name: 'Negativity bias',
                short: 'Bad news lands harder and lingers longer than good.',
                body: `Threats, criticisms, and setbacks tend to grab more of our attention and stay with us longer than positives of equal size. Negativity bias is one of the better-established tendencies in psychology.

An ancestor who paid more attention to danger than to pleasant things was more likely to survive to pass that wiring on. The cost today is that a single sharp moment can crowd out a more balanced read of things. Knowing the scales are tilted can be a reason to deliberately give the fuller picture its due weight.`
            },
            {
                id: 'affective-forecasting',
                name: 'The affective-forecasting error',
                short: 'We’re surprisingly bad at predicting how we’ll feel later.',
                body: `When we imagine future outcomes, we tend to overestimate how intensely — and how long — they'll affect us. Good news rarely lifts us as much or as lastingly as expected; feared outcomes are often more survivable than they look from here. Researchers call the gap an affective-forecasting error.

We seem built to simulate the future vividly enough to motivate action, not to predict our feelings accurately. That's useful for getting us moving, less useful when dread of an outcome is doing more to drive us than the outcome itself would warrant. It can help to ask how you've actually felt after similar moments in the past.`
            },
            {
                id: 'social-threat',
                name: 'Social threat & belonging',
                short: 'Rejection and exclusion can register almost like physical danger.',
                body: `Humans are unusually attuned to where we stand with others. Signals of disapproval, exclusion, or lost standing can trigger a stress response out of proportion to any practical harm, because for most of our history belonging to the group was a survival matter.

In a modern life with many overlapping groups and far weaker stakes, that same sensitivity can make social risk feel larger than it is — and can quietly steer how we act toward whatever avoids disapproval. Recognising when something is being driven by how it will land socially, rather than by its own merits, can restore some perspective.`
            }
        ];

        // ─── Blocklist: discredited / outdated techniques the model must not recommend ───
        const BLOCKLIST = [
            'critical incident stress debriefing',
            'catharsis or venting as emotional release ("getting it all out")',
            'rebirthing or other regression therapies',
            'subliminal-message or "trapped emotion" / energy-clearing techniques',
            'personality typing (e.g. MBTI, Enneagram) used as diagnosis',
            'positive affirmations used as a standalone fix'
        ];

        // ─── Fallback exercises if the model call/parse fails (established, pattern-oriented) ───
        const FALLBACK_EXERCISES = [
            { name: 'Behaviour-chain log (ABC)', tradition: 'CBT / behavioural science', one_line: 'Note what comes just before the pattern and what it gives you just after, a few times over.', why_it_fits: 'A plain way to see what sets a recurring pattern off and what keeps it going.' },
            { name: 'Values clarification', tradition: 'ACT', one_line: 'Write down what actually matters to you, then look at where the pattern pulls against it.', why_it_fits: 'Useful when a habit keeps overriding what you care about.' }
        ];

        // ─── House style for generated text ───
        // Shared with Council. Leads with a positive voice description, then names
        // specific tells to avoid, so the model's output reads like a person.
        const HOUSE_STYLE = `WRITING STYLE — read like a thoughtful, plain-spoken person, not like AI:
- Write in warm, plain British English. Short, varied sentences. Use everyday words and let the rhythm be a little uneven, the way real writing is.
- Be concrete. Use the specific details the person gave you rather than abstract, general phrasing.
- Use plain verbs (is, has, does, helps) instead of inflated ones (serves as, leverages, boasts, fosters, empowers).
- Avoid the usual AI tells: words like delve, underscore, showcase, tapestry, testament, pivotal, intricate, robust, seamless, navigate, landscape, realm, foster, elevate, journey, unpack; openers like "In today's world", "It's worth noting that", "Let's dive in"; and the "not just X, but Y" / "it's not… it's…" construction.
- Go easy on em dashes. Don't pad with rule-of-three lists or neat little summaries. When unsure, be plainer and more specific.`;

        // ─── Main Component ───
        const CognitiveCounsel = () => {
            const [stage, setStage] = useState('welcome');
            const [initialQuery, setInitialQuery] = useState('');
            const [generatedQuestions, setGeneratedQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [contextualAnswers, setContextualAnswers] = useState([]);
            const [enrichedPromptCache, setEnrichedPromptCache] = useState('');
            const [loading, setLoading] = useState(false);
            const [loadingMessage, setLoadingMessage] = useState('');

            // Guide stage
            const [guide, setGuide] = useState(null);
            const [guideLoading, setGuideLoading] = useState(false);
            const [openPrimerId, setOpenPrimerId] = useState(null);

            // Exercise stage
            const [activeExercise, setActiveExercise] = useState(null);
            const [exerciseData, setExerciseData] = useState(null);
            const [exerciseLoading, setExerciseLoading] = useState(false);
            const [exerciseAnswers, setExerciseAnswers] = useState({});
            const [exerciseStepIndex, setExerciseStepIndex] = useState(0);

            const [toast, setToast] = useState(null);
            const [resumeAvailable, setResumeAvailable] = useState(null);
            const hasRestoredRef = useRef(false);

            const STORAGE_KEY = 'cognitive_counsel_session_v3';
            const SESSION_TTL_MS = 24 * 60 * 60 * 1000;

            const showToast = (message, type = 'error') => setToast({ message, type, id: Date.now() });

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(null), 4500);
                return () => clearTimeout(t);
            }, [toast]);

            const renderMarkdown = (text) => {
                const html = marked.parse(text || '');
                return window.DOMPurify ? DOMPurify.sanitize(html) : html;
            };

            const loadingMessages = [
                "Reticulating splines...",
                "Reading what you wrote...",
                "Looking for what might be underneath...",
                "Finding exercises that fit...",
                "Mapping the terrain...",
                "Thinking it over...",
                "Checking what still holds up...",
                "Sorting through the options..."
            ];
            const getRandomLoadingMessage = () => loadingMessages[Math.floor(Math.random() * loadingMessages.length)];

            // ─── API Helper (with retry + exponential backoff) ───
            const callAPI = async (message, systemRole, { retries = 2, signal } = {}) => {
                let lastError;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message, systemRole }),
                            signal
                        });
                        if (!response.ok) {
                            if (response.status >= 400 && response.status < 500) throw new Error(`Request failed (${response.status})`);
                            throw new Error(`Server error (${response.status})`);
                        }
                        const data = await response.json();
                        if (data.type === 'error' || data.error) {
                            throw new Error(data.error?.message || JSON.stringify(data.error) || 'API error');
                        }
                        return data.response || data.content || data.message || JSON.stringify(data);
                    } catch (err) {
                        lastError = err;
                        if (err.name === 'AbortError') throw err;
                        if (attempt === retries) break;
                        const delay = 800 * Math.pow(2.5, attempt) + Math.random() * 300;
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
                throw lastError;
            };

            const parseJSON = (raw) => {
                const cleaned = (raw || '').replace(/```json\n?|\n?```/g, '').trim();
                return JSON.parse(cleaned);
            };

            // ─── Welcome → Query ───
            const proceedToQuery = () => setStage('query');

            // ─── Query → Questions (internal analysis, then dispositional intake) ───
            const handleInitialSubmit = async (e) => {
                e.preventDefault();
                if (!initialQuery.trim()) return;

                setLoading(true);
                setLoadingMessage(getRandomLoadingMessage());

                try {
                    // STEP 1 (internal only — never shown to the user): understand the pattern
                    // well enough to ask good questions. Scaffolding, not a diagnosis.
                    const analysisPrompt = `You are a perceptive intake analyst. A person has named a recurring pattern in themselves they want to understand:

"${initialQuery}"

Before we generate intake questions, privately analyse what's going on. This analysis is internal scaffolding to help us ask better questions — it is NEVER shown to the person and is NOT a diagnosis. Respond with a brief JSON object:
{
  "stated_pattern": "The pattern they've named",
  "likely_real_question": "What they may actually be trying to understand underneath",
  "where_it_might_show_up": ["Situations or relationships this pattern might span"],
  "possible_function": "What the pattern might protect them from or get them out of (tentative)",
  "missing_context": ["Specific context that would genuinely sharpen the help we can offer"],
  "emotional_layer": "What feelings may sit under this but haven't been stated"
}

Be specific to THIS pattern. No generic psychology. JSON only, no markdown.`;

                    let analysis;
                    try {
                        analysis = parseJSON(await callAPI(analysisPrompt, 'intake_analyst'));
                    } catch (e) {
                        analysis = {
                            stated_pattern: initialQuery,
                            likely_real_question: "Unclear — need more context",
                            where_it_might_show_up: [],
                            possible_function: "Unknown",
                            missing_context: ["A concrete recent instance", "Where else it shows up", "What it might protect"],
                            emotional_layer: "Not yet surfaced"
                        };
                    }

                    setLoadingMessage(getRandomLoadingMessage());

                    // STEP 2: dispositional intake questions. The person does the examining.
                    const questionPrompt = `You are a Socratic intake specialist. A person has named a recurring pattern in themselves they want to examine. Your job is to ask questions that help THEM look at it more clearly — and that gather enough context to later suggest established exercises for examining a pattern like this.

The person said: "${initialQuery}"

Your private read of what's going on (do NOT reference it directly, and do NOT diagnose them):
${JSON.stringify(analysis, null, 2)}

Generate exactly 4 questions. Each serves a distinct purpose:
1. A CONCRETE INSTANCE — ask about the most recent time this actually happened, in detail. Specifics, not summary.
2. BREADTH — where else does this show up? Which situations or relationships? This helps see how wide the pattern runs.
3. FUNCTION OR COST — what does it seem to get them out of, protect, or cost them? Asked gently, as something to wonder about, not a verdict.
4. HISTORY OR ATTEMPTS — when did they first notice it, or what have they already tried? Their own observations.

CRITICAL RULES:
- Every question must be specific to THIS person's exact pattern. No generic coaching questions.
- Sound like a curious, perceptive friend — not a therapist or a form.
- Do NOT name or diagnose their pattern back to them. You are helping them look, not telling them what they are.
- The placeholder hints at the KIND of answer that helps, not a repeat of the question.

${HOUSE_STYLE}

Respond with ONLY a JSON array:
[{"question": "...", "placeholder": "Hint..."}]`;

                    let questions;
                    try {
                        questions = parseJSON(await callAPI(questionPrompt, 'question_generator'));
                    } catch (e) {
                        questions = [
                            { question: "When did this last happen? Walk through the specific moment — what was going on, and what did you do?", placeholder: "A concrete recent instance, not the general version..." },
                            { question: "Where else does this show up for you — other situations, other relationships?", placeholder: "The range of places you notice it..." },
                            { question: "When it plays out, what does it seem to get you out of, or save you from?", placeholder: "Something to wonder about, not a verdict..." },
                            { question: "When did you first notice this about yourself, and have you tried anything with it before?", placeholder: "Your own history with it..." }
                        ];
                    }
                    setGeneratedQuestions(questions);
                    setStage('questions');
                } catch (error) {
                    console.error('Error generating questions:', error);
                    showToast('Something went wrong generating questions. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            // ─── Questions → Guide ───
            const submitIntake = async () => {
                const saved = generatedQuestions.map((q, idx) => ({ question: q.question, answer: answers[idx] || '' }));
                setContextualAnswers(saved);

                let enriched = `Pattern they want to examine: ${initialQuery}\n\nContext gathered through intake:\n`;
                generatedQuestions.forEach((q, idx) => {
                    enriched += `\nQ: ${q.question}\nA: ${answers[idx] || '(no answer provided)'}\n`;
                });
                setEnrichedPromptCache(enriched);

                setStage('guide');
                setGuide(null);
                setGuideLoading(true);
                setLoadingMessage(getRandomLoadingMessage());

                const prompt = `You are the engine behind a tool that helps a person examine a recurring pattern in THEMSELVES. You do NOT analyse the person, name or diagnose their pattern, deliver verdicts, or interpret them. They have already named the pattern; your job is two practical things: (a) decide which cognitive mechanisms — if any — are worth them understanding, and (b) recommend established exercises they can use to examine the pattern on their own.

The pattern they named: "${initialQuery}"

Context they shared:
${enriched}

PART A — MECHANISMS (gated, conditional):
You may name mechanisms ONLY from this fixed list:
${primers.map(p => `- ${p.id}: ${p.name} — ${p.short}`).join('\n')}

Include a mechanism's id ONLY if BOTH are true:
1. It is widely acknowledged that this mechanism is likely relevant to patterns of this kind, AND
2. Understanding it would genuinely help THIS person make sense of their pattern.
If neither clearly holds, return an EMPTY list. Returning nothing is correct and common — do NOT force a connection to fill space. Never name a mechanism outside the list. These are offered as possibilities to understand, never as the explanation for who they are.

PART B — EXERCISES (2 or 3):
Recommend established, currently-practised exercises that a person can use to examine a recurring pattern themselves, from named evidence-based traditions (e.g. CBT, ACT, behavioural science). Good fits include behaviour-chain / functional analysis (ABC), self-monitoring logs, values clarification, behavioural experiments, and implementation intentions (if-then plans). Rules:
- Name the TRADITION, not a specific study or paper.
- Use only recognised techniques in current professional use. Do NOT invent exercises.
- Do NOT recommend any of these discredited or outdated techniques: ${BLOCKLIST.join('; ')}.
- Tailor "why_it_fits" using the person's OWN words/details from their context.
- These are tools the person works through themselves to look at their own pattern — never frame them as analysis you will perform.

THIN INPUT: If their answers are mostly empty or very thin, set "thin_input": true and choose broadly-applicable exercises.

The "one_line" and "why_it_fits" fields are shown to the person, so they must follow this style:
${HOUSE_STYLE}

Respond with ONLY this JSON, no markdown:
{
  "thin_input": false,
  "relevant_mechanisms": ["id"],
  "exercises": [
    {"name": "...", "tradition": "...", "one_line": "...", "why_it_fits": "..."}
  ]
}`;

                try {
                    const parsed = parseJSON(await callAPI(prompt, 'guide_select'));
                    const validIds = new Set(primers.map(p => p.id));
                    parsed.relevant_mechanisms = (parsed.relevant_mechanisms || []).filter(id => validIds.has(id));
                    parsed.exercises = (parsed.exercises || []).slice(0, 3);
                    if (parsed.exercises.length === 0) parsed.exercises = FALLBACK_EXERCISES;
                    setGuide(parsed);
                } catch (error) {
                    console.error('Guide error:', error);
                    setGuide({ thin_input: true, relevant_mechanisms: [], exercises: FALLBACK_EXERCISES, degraded: true });
                    showToast('Had trouble tailoring this — showing broadly useful exercises instead.');
                } finally {
                    setGuideLoading(false);
                }
            };

            // ─── Guide → Exercise ───
            const startExercise = async (ex) => {
                setActiveExercise(ex);
                setExerciseData(null);
                setExerciseAnswers({});
                setExerciseStepIndex(0);
                setStage('exercise');
                setExerciseLoading(true);
                window.scrollTo({ top: 0, behavior: 'instant' });

                const prompt = `A person has chosen to work through an established exercise on their own, to examine a recurring pattern in themselves. Produce a clear, interactive scaffold for "${ex.name}" (tradition: ${ex.tradition}) that THEY fill in. You provide structure and prompts only — you do NOT answer for them, interpret their pattern, name what it means, or analyse them.

The pattern they named: "${initialQuery}"
Context they shared:
${enrichedPromptCache}

Produce the exercise as a series of steps. Each step is an instruction plus a question for them to answer in their own words. Keep it faithful to how this technique is actually practised. Customise the wording to their pattern using their own details where natural, but never fill in their answers and never tell them what their pattern means.

All text you write here is read by the person, so it must follow this style:
${HOUSE_STYLE}

Respond with ONLY this JSON, no markdown:
{
  "name": "${ex.name}",
  "tradition": "${ex.tradition}",
  "intro": "1-2 sentences: what this exercise is and what working through it does. No interpretation of the person.",
  "steps": [
    {"prompt": "The instruction/question for this step", "placeholder": "a hint at the kind of answer", "guidance": "optional one-line tip, or empty string"}
  ],
  "closing": "1-2 sentences on what to do with what they've written — a question to sit with or a suggestion to revisit. NEVER an interpretation of their answers or their pattern."
}
Aim for 3 to 6 steps.`;

                try {
                    const parsed = parseJSON(await callAPI(prompt, 'exercise_build'));
                    if (!Array.isArray(parsed.steps) || parsed.steps.length === 0) throw new Error('No steps');
                    setExerciseData(parsed);
                } catch (error) {
                    console.error('Exercise build error:', error);
                    setExerciseData({ error: true });
                    showToast('Could not load this exercise. Please try again.');
                } finally {
                    setExerciseLoading(false);
                }
            };

            const exerciseTotalSteps = exerciseData?.steps?.length || 0;
            const onReview = exerciseData && !exerciseData.error && exerciseStepIndex >= exerciseTotalSteps;

            // ─── Export the USER'S OWN work (open loop — no AI interpretation) ───
            const buildExerciseText = () => {
                let t = `${exerciseData.name.toUpperCase()} — your work\n${'='.repeat(40)}\n\n`;
                t += `Pattern: ${initialQuery}\n\n${'='.repeat(40)}\n\n`;
                exerciseData.steps.forEach((s, i) => {

                                                <h2 className="font-display text-2xl text-white">{exerciseData.name}</h2>
                                                {exerciseData.tradition && (
                                                    <span className="px-2 py-0.5 rounded-full bg-slate-500/15 text-slate-300 text-xs border border-slate-400/20">{exerciseData.tradition}</span>
                                                )}
                                            </div>
                                            {exerciseData.intro && <p className="text-slate-400 text-[15px] leading-relaxed">{exerciseData.intro}</p>}
                                        </div>

                                        {!onReview ? (
                                            <>
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-violet-400 to-amber-500 transition-all duration-500"
                                                            style={{width: `${(exerciseStepIndex / exerciseTotalSteps) * 100}%`}} />
                                                    </div>
                                                    <span className="text-slate-500 text-xs whitespace-nowrap">Step {exerciseStepIndex + 1} of {exerciseTotalSteps}</span>
                                                </div>

                                                {(() => {
                                                    const step = exerciseData.steps[exerciseStepIndex];
                                                    return (
                                                        <div className="bg-white/5 backdrop-blur rounded-2xl p-6 border border-white/10">
                                                            <p className="text-white font-medium mb-2 leading-relaxed">{step.prompt}</p>
                                                            {step.guidance && <p className="text-slate-400 text-sm mb-3">{step.guidance}</p>}
                                                            <textarea
                                                                value={exerciseAnswers[exerciseStepIndex] || ''}
                                                                onChange={(e) => setExerciseAnswers(prev => ({...prev, [exerciseStepIndex]: e.target.value}))}
                                                                placeholder={step.placeholder || 'Take your time…'}
                                                                className="w-full h-36 bg-white/5 text-white placeholder-slate-600 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-amber-500/40 border border-white/10 resize-none"
                                                                autoFocus
                                                            />
                                                        </div>
                                                    );
                                                })()}

                                                <div className="flex gap-4">
                                                    <button onClick={() => setExerciseStepIndex(i => Math.max(0, i - 1))} disabled={exerciseStepIndex === 0}
                                                        className="flex-1 bg-white/5 text-slate-300 font-medium py-3.5 rounded-xl hover:bg-white/10 transition-all border border-white/10 disabled:opacity-30">
                                                        ← Back
                                                    </button>
                                                    <button onClick={() => setExerciseStepIndex(i => i + 1)}
                                                        className="flex-1 bg-gradient-to-r from-violet-500 to-amber-500 text-white font-medium py-3.5 rounded-xl hover:from-violet-600 hover:to-amber-600 transition-all">
                                                        {exerciseStepIndex === exerciseTotalSteps - 1 ? 'Finish →' : 'Continue →'}
                                                    </button>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <div className="bg-white/5 backdrop-blur rounded-2xl p-6 border border-white/10 space-y-4">
                                                    <h3 className="text-lg font-semibold text-white">What you wrote</h3>
                                                    {exerciseData.steps.map((s, i) => (
                                                        <div key={i} className="border-l-2 border-amber-500/30 pl-4">
                                                            <p className="text-slate-400 text-sm mb-1">{s.prompt}</p>
                                                            <p className="text-slate-200 text-[15px] whitespace-pre-wrap">{exerciseAnswers[i]?.trim() || <span className="text-slate-600 italic">(left blank)</span>}</p>
                                                        </div>
                                                    ))}
                                                </div>

                                                {exerciseData.closing && (
                                                    <div className="bg-amber-500/5 border border-amber-400/20 rounded-2xl p-5">
                                                        <p className="text-amber-100/90 text-[15px] leading-relaxed">{exerciseData.closing}</p>
                                                    </div>
                                                )}

                                                <p className="text-slate-500 text-xs text-center">
                                                    These are your words. Nothing here gets sent off for analysis. What you do with them is up to you.
                                                </p>

                                                <div className="flex gap-3">
                                                    <button onClick={copyExercise} className="flex-1 bg-white/5 text-slate-300 font-medium py-3 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">📋 Copy my work</button>
                                                    <button onClick={downloadExercisePDF} className="flex-1 bg-white/5 text-slate-300 font-medium py-3 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">📄 Download PDF</button>
                                                </div>

                                                <div className="flex gap-4">
                                                    <button onClick={() => setExerciseStepIndex(exerciseTotalSteps - 1)}
                                                        className="flex-1 bg-white/5 text-slate-300 font-medium py-3.5 rounded-xl hover:bg-white/10 transition-all border border-white/10">
                                                        ← Revisit my answers
                                                    </button>
                                                    <button onClick={() => setStage('guide')}
                                                        className="flex-1 bg-gradient-to-r from-violet-500 to-amber-500 text-white font-medium py-3.5 rounded-xl hover:from-violet-600 hover:to-amber-600 transition-all">
                                                        Try another exercise →
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </>
                                ) : null}
                            </div>
                        )}

                        {/* ─── Footer ─── */}
                        {stage !== 'welcome' && (
                            <div className="mt-12 pt-6 border-t border-white/5">
                                <div className="text-center space-y-3">
                                    <p className="text-slate-600 text-xs">
                                        <strong className="text-slate-500">Privacy:</strong> Your answers and exercise responses stay in your browser. The questions and exercise scaffolds are generated through Anthropic's Claude API; nothing you write is stored by this application. Anthropic retains API conversations for 30 days for safety monitoring.{' '}
                                        <a href="https://www.anthropic.com/legal/privacy" target="_blank" rel="noopener noreferrer" className="text-amber-500/40 hover:text-amber-400">Learn more</a>
                                    </p>
                                    <p className="text-slate-700 text-xs">Created by Nicole Scheid & Claude (Anthropic) · v3.0</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<CognitiveCounsel />, document.getElementById('root'));
    </script>
</body>
</html>
