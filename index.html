                                        );
                                    })}
                                </div>

                                <div className="text-center mt-6">
                                    <button onClick={goToIntake} className="text-slate-500 text-xs hover:text-slate-400 underline">
                                        Start over with a different question
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ─── ANALYSING ─── */}
                        {stage === 'analysing' && (
                            <div className="flex items-center justify-center min-h-[60vh] animate-fade-in">
                                <div className="text-center">
                                    <div className="flex justify-center gap-3 mb-6">
                                        {patterns.length > 0 ? patterns.map((p, i) => (
                                            <span key={p.id}
                                                title={p.name}
                                                className={`text-3xl transition-opacity ${p.loading ? 'opacity-40 animate-breathe' : p.error ? 'opacity-50 grayscale' : 'opacity-100'}`}
                                                style={p.loading ? {animationDelay: `${i * 0.4}s`} : {}}
                                            >{p.emoji}</span>
                                        )) : neuralSystems.map((s, i) => (
                                            <span key={s.id} className="text-3xl animate-breathe" style={{animationDelay: `${i * 0.4}s`}}>
                                                {s.emoji}
                                            </span>
                                        ))}
                                    </div>
                                    <p className="text-white text-xl mb-3">{loadingMessage}</p>
                                    {patterns.length > 0 && (
                                        <p className="text-amber-200/70 text-sm font-medium mb-2">
                                            {patterns.filter(p => !p.loading).length} of {patterns.length} perspectives ready
                                        </p>
                                    )}
                                    <p className="text-slate-500 text-sm max-w-md mx-auto">
                                        The five systems are examining your pattern in parallel. Usually takes 30-45 seconds.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* ─── PATTERNS: STEPPED REVEAL ─── */}
                        {stage === 'patterns' && !revealComplete && patterns.length > 0 && (
                            <div className="animate-fade-in">
                                {/* Progress indicator */}
                                <div className="flex items-center justify-between mb-6">
                                    <p className="text-slate-500 text-xs uppercase tracking-wider">Pattern Illumination</p>
                                    <div className="flex gap-1.5">
                                        {patterns.map((_, i) => (
                                            <div key={i} className={`w-2 h-2 rounded-full transition-colors ${
                                                i === currentStep ? 'bg-amber-400' : i < currentStep ? 'bg-violet-400/60' : 'bg-white/10'
                                            }`} />
                                        ))}
                                        <div className={`w-2 h-2 rounded-full ${revealComplete ? 'bg-amber-400' : 'bg-white/10'}`} />
                                    </div>
                                </div>

                                {/* Your question */}
                                <div className="bg-white/5 rounded-xl p-4 border border-white/10 mb-6">
                                    <p className="text-slate-400 text-xs mb-1">Your question</p>
                                    <p className="text-white italic">"{patternQuery}"</p>
                                </div>

                                {/* Current system card */}
                                <SystemCard system={patterns[currentStep]} isActive={true} />

                                {/* Navigation */}
                                <div className="flex items-center justify-between mt-6">
                                    <button onClick={goToPrev} disabled={currentStep === 0}
                                        className="px-4 py-2 bg-white/5 text-slate-400 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm disabled:opacity-30 disabled:cursor-not-allowed">
                                        ← Previous
                                    </button>
                                    <button onClick={goToOverview}
                                        className="text-slate-500 text-xs hover:text-slate-400 underline">
                                        See all at once
                                    </button>
                                    <button onClick={goToNext}
                                        className="px-4 py-2 bg-gradient-to-r from-violet-500/80 to-amber-500/80 text-white rounded-xl hover:from-violet-500 hover:to-amber-500 transition-all text-sm">
                                        {currentStep < patterns.length - 1 ? 'Next perspective →' : 'See the full picture →'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ─── PATTERNS: FULL OVERVIEW ─── */}
                        {stage === 'patterns' && revealComplete && patterns.length > 0 && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="text-center mb-8">
                                    <div className="flex justify-center mb-4"><CounselBrain /></div>
                                    <h2 className="font-display text-3xl text-white mb-2">The Full Picture</h2>
                                    <p className="text-slate-400">Five perspectives on the pattern underneath your question</p>
                                </div>

                                <div className="bg-white/5 rounded-xl p-4 border border-white/10">
                                    <p className="text-slate-400 text-xs mb-1">Your question</p>
                                    <p className="text-white italic">"{patternQuery}"</p>
                                </div>

                                {/* Export */}
                                <div className="flex gap-3">
                                    <button onClick={copyToClipboard} className="flex-1 bg-white/5 text-slate-300 font-medium py-2.5 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">
                                        📋 Copy
                                    </button>
                                    <button onClick={downloadPDF} className="flex-1 bg-white/5 text-slate-300 font-medium py-2.5 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">
                                        📄 PDF
                                    </button>
                                </div>

                                {/* All system cards */}
                                {patterns.map((system, idx) => (
                                    <div key={system.id} className="animate-fade-in" style={{animationDelay: `${idx * 80}ms`}}>
                                        <SystemCard system={system} isActive={false} />
                                    </div>
                                ))}

                                {/* Summary of reactions */}
                                {Object.keys(userReactions).length > 0 && (
                                    <div className="bg-white/5 rounded-2xl p-5 border border-white/10">
                                        <p className="text-slate-400 text-xs uppercase tracking-wider mb-3">Your reactions</p>
                                        <div className="space-y-2">
                                            {Object.entries(userReactions).map(([id, reaction]) => {
                                                const system = neuralSystems.find(s => s.id === id);
                                                const r = reactions.find(r => r.value === reaction);
                                                return (
                                                    <p key={id} className={`text-sm ${reaction === 'probably-right' ? 'text-amber-300' : 'text-slate-300'}`}>
                                                        {system?.emoji} {system?.name}: {r?.emoji} {r?.label}
                                                    </p>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* Next actions */}
                                <div className="bg-gradient-to-br from-violet-900/20 to-amber-900/20 rounded-2xl p-8 border border-amber-500/10">
                                    <div className="text-center space-y-4">
                                        {Object.values(userReactions).includes('probably-right') && (
                                            <p className="text-amber-300/80 text-sm italic mb-4">
                                                The patterns that make you flinch are the ones most worth sitting with.
                                            </p>
                                        )}

                                        {/* Unexplored patterns */}
                                        {detectedPatterns.length > 1 && detectedPatterns.some(p => !exploredPatternIds.includes(p.id)) && (
                                            <div className="text-left mb-6">
                                                <h4 className="font-display text-lg text-white mb-3 text-center">
                                                    Other patterns we noticed
                                                </h4>
                                                <p className="text-slate-400 text-sm text-center mb-4">
                                                    You explored one thread. Here are the others — each one is a different angle on what's underneath.
                                                </p>
                                                <div className="space-y-3">
                                                    {detectedPatterns.filter(p => !exploredPatternIds.includes(p.id)).map((pattern, idx) => (
                                                        <button
                                                            key={pattern.id}
                                                            onClick={() => explorePattern(detectedPatterns.indexOf(pattern))}
                                                            className="w-full text-left rounded-xl p-4 bg-white/5 border border-violet-500/20 hover:border-amber-500/30 hover:bg-white/10 transition-all"
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <div>
                                                                    <h5 className="font-display text-white">{pattern.name}</h5>
                                                                    <p className="text-slate-400 text-sm">{pattern.description}</p>
                                                                </div>
                                                                <span className="text-slate-500 text-sm flex-shrink-0 ml-4">Explore →</span>
                                                            </div>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* All explored, or single pattern */}
                                        {(detectedPatterns.length <= 1 || detectedPatterns.every(p => exploredPatternIds.includes(p.id))) && (
                                            <div className="flex gap-4 justify-center flex-wrap">
                                                <button onClick={goToIntake}
                                                    className="px-5 py-2.5 bg-white/5 text-slate-300 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">
                                                    Explore a different question
                                                </button>
                                                <a href="https://cognitivecouncil.com"
                                                    className="px-6 py-2.5 bg-gradient-to-r from-blue-500/80 to-indigo-500/80 text-white rounded-xl hover:from-blue-500 hover:to-indigo-500 transition-all text-sm">
                                                    Take a new question to Council →
                                                </a>
                                            </div>
                                        )}

                                        <p className="text-slate-600 text-xs pt-2">
                                            Insight → Decision → Insight → ...
                                        </p>
                                    </div>
                                </div>

                                {/* Back to stepped view */}
                                <div className="text-center">
                                    <button onClick={() => { setRevealComplete(false); setCurrentStep(0); window.scrollTo({top:0,behavior:'smooth'}); }}
                                        className="text-slate-500 text-xs hover:text-slate-400 underline">
                                        ← Back to stepped view
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ─── Footer ─── */}
                        {!['loading', 'gate'].includes(stage) && (
                            <div className="mt-12 pt-6 border-t border-white/5">
                                <div className="text-center space-y-3">
                                    <p className="text-slate-600 text-xs">
                                        <strong className="text-slate-500">Privacy:</strong> Conversations are processed through Anthropic's Claude API. 
                                        No data is stored by this application.{' '}
                                        <a href="https://www.anthropic.com/legal/privacy" target="_blank" rel="noopener noreferrer" className="text-amber-500/40 hover:text-amber-400">
                                            Learn more
                                        </a>
                                    </p>
                                    <p className="text-slate-700 text-xs">
                                        Created by Nicole Scheid & Claude (Anthropic) · v2.4
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<CognitiveCounsel />, document.getElementById('root'));
    </script>
</body>
</html>
